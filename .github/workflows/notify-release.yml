name: Notify poster

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    name: Dispatch release to poster
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Send repository_dispatch
      env:
        GH_TOKEN: ${{ secrets.POSTER_DISPATCH_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        gh api repos/kolomiiets-oleksii/poster/dispatches \
          -f event_type=mediabridge-release \
          -f "client_payload[tag]=$RELEASE_TAG"
