name: Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: '6.1'
            xcode: '16.4'
            runner: macos-15
            ios: '18.5'
            device: iPhone 16
          - swift: '6.2'
            xcode: '26.2'
            runner: macos-26
            ios: '26.2'
            device: iPhone 17
          - swift: '6.3'
            xcode: '26.6'
            runner: macos-26
            ios: '26.5'
            device: iPhone 17

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode ${{ matrix.xcode }}
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Run tests
      run: |
        xcodebuild test \
          -scheme MediaBridge \
          -destination 'platform=iOS Simulator,OS=${{ matrix.ios }},name=${{ matrix.device }}' \
          -derivedDataPath .build \
          -enableCodeCoverage YES

  build-swift-6-0-floor:
    name: Build (Swift 6.0, Xcode 16.0)
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode 16.0
      run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Build for iOS
      run: |
        xcodebuild build \
          -scheme MediaBridge \
          -destination 'generic/platform=iOS'

  test-xcode-27-preview:
    name: Test (Xcode 27 preview)
    runs-on: xcode-27
    continue-on-error: true

    steps:
    - uses: actions/checkout@v5

    - name: Show Swift version
      run: swift --version

    - name: Run tests
      run: |
        xcodebuild test \
          -scheme MediaBridge \
          -destination 'platform=iOS Simulator,OS=27.0,name=iPhone 17' \
          -derivedDataPath .build
