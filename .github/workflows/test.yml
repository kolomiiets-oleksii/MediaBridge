name: Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview_image || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: '6.1'
            xcode: '16.4'
            runner: macos-15
            runtime: iOS-18-5
            device_type: iPhone-16
          - swift: '6.2'
            xcode: '26.2'
            runner: macos-26
            runtime: iOS-26-2
            device_type: iPhone-17
          - swift: '6.3'
            xcode: '26.6'
            runner: macos-26
            runtime: iOS-26-5
            device_type: iPhone-17
          - swift: '6.4'
            xcode: '27.0'
            runner: xcode-27
            runtime: iOS-27-0
            device_type: iPhone-17
            preview_image: true

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode ${{ matrix.xcode }}
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: List installed simulator runtimes
      run: xcrun simctl list runtimes

    - name: Create and boot simulator
      run: |
        udid=$(xcrun simctl create ci-device \
          "com.apple.CoreSimulator.SimDeviceType.${{ matrix.device_type }}" \
          "com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}" | tail -1)
        xcrun simctl bootstatus "$udid" -b
        echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"

    - name: Run tests
      run: |
        xcodebuild test \
          -scheme MediaBridge \
          -destination "id=$SIMULATOR_ID" \
          -derivedDataPath .build \
          -enableCodeCoverage YES

  build-swift-6-0-floor:
    name: Build (Swift 6.0, Xcode 16.0)
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode 16.0
      run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Build for iOS
      run: |
        xcodebuild build \
          -scheme MediaBridge \
          -destination 'generic/platform=iOS'
