name: Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: List available iOS runtimes
      run: xcrun simctl list runtimes

    - name: Create and boot iOS Simulator
      run: |
        # Get the latest iOS runtime available
        RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+")
        echo "Using runtime: $RUNTIME"

        # Create simulator
        SIMULATOR_ID=$(xcrun simctl create test-device com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME" 2>&1 | tail -1)
        echo "Created simulator: $SIMULATOR_ID"

        # Boot it
        xcrun simctl boot "$SIMULATOR_ID"

        # Wait for it to boot
        sleep 5

        echo "SIMULATOR_ID=$SIMULATOR_ID" >> $GITHUB_ENV

    - name: Run tests with iOS Simulator
      run: |
        xcodebuild test \
          -scheme MediaBridge \
          -destination "id=${{ env.SIMULATOR_ID }}" \
          -derivedDataPath .build \
          -enableCodeCoverage YES \
          -verbose

  build:
    name: Build (minimum toolchain)
    # Pinned: macos-latest (macos-26) no longer ships any Xcode 16, and this job
    # exists to prove the Swift 6.0 floor in Package.swift still compiles.
    # When this image is retired, raise the floor or drop the job — do not switch
    # it to a newer Xcode, which would make it verify nothing.
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 16
      run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Build for iOS
      run: |
        xcodebuild build \
          -scheme MediaBridge \
          -destination 'generic/platform=iOS'
