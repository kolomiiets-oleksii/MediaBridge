name: Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview_image || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: '6.1'
            runner: macos-15
          - swift: '6.2'
            runner: macos-26
          - swift: '6.3'
            runner: macos-26
          - swift: '6.4'
            runner: xcode-27
            preview_image: true

    steps:
    - uses: actions/checkout@v5

    - name: Select the newest Xcode providing Swift ${{ matrix.swift }}
      run: |
        for app in $(ls -d /Applications/Xcode*.app | sort -V); do
          swift_binary="$app/Contents/Developer/usr/bin/swift"
          [ -x "$swift_binary" ] || continue
          version=$("$swift_binary" --version 2>/dev/null | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p')
          case "$version" in
            ${{ matrix.swift }}|${{ matrix.swift }}.*) selected="$app" ;;
          esac
        done
        if [ -z "${selected:-}" ]; then
          echo "::error::No installed Xcode provides Swift ${{ matrix.swift }} on ${{ matrix.runner }}"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        sudo xcode-select -s "$selected/Contents/Developer"
        swift --version

    - name: Create and boot a simulator the selected Xcode supports
      run: |
        sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
        runtime=$(xcrun simctl list runtimes --json | jq -r --arg sdk "$sdk_version" '
          [.runtimes[]
            | select(.isAvailable and (.identifier | test("SimRuntime\\.iOS-")))
            | select((.version | split(".") | map(tonumber)) <= ($sdk | split(".") | map(tonumber)))]
          | sort_by(.version | split(".") | map(tonumber))
          | last // empty
          | .identifier')
        if [ -z "$runtime" ]; then
          echo "::error::No installed iOS simulator runtime is usable with the iOS $sdk_version SDK"
          xcrun simctl list runtimes
          exit 1
        fi
        for device_type in $(xcrun simctl list devicetypes --json | jq -r '
          [.devicetypes[] | select(.productFamily == "iPhone")] | reverse | .[].identifier'); do
          udid=$(xcrun simctl create ci-device "$device_type" "$runtime" 2>/dev/null | tail -1) || continue
          [ -n "$udid" ] && break
        done
        if [ -z "${udid:-}" ]; then
          echo "::error::No iPhone device type could be created for $runtime"
          exit 1
        fi
        xcrun simctl bootstatus "$udid" -b
        echo "SIMULATOR_ID=$udid" >> "$GITHUB_ENV"

    - name: Run tests
      run: |
        xcodebuild test \
          -scheme MediaBridge \
          -destination "id=$SIMULATOR_ID" \
          -derivedDataPath .build \
          -enableCodeCoverage YES

  build-swift-6-0-floor:
    name: Build (Swift 6.0)
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v5

    - name: Select the newest Xcode providing Swift 6.0
      run: |
        for app in $(ls -d /Applications/Xcode*.app | sort -V); do
          swift_binary="$app/Contents/Developer/usr/bin/swift"
          [ -x "$swift_binary" ] || continue
          version=$("$swift_binary" --version 2>/dev/null | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p')
          case "$version" in
            6.0|6.0.*) selected="$app" ;;
          esac
        done
        if [ -z "${selected:-}" ]; then
          echo "::error::No installed Xcode provides Swift 6.0 on macos-15"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        sudo xcode-select -s "$selected/Contents/Developer"
        swift --version

    - name: Build for iOS
      run: |
        xcodebuild build \
          -scheme MediaBridge \
          -destination 'generic/platform=iOS'
