name: Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: List available iOS runtimes
      run: xcrun simctl list runtimes

    - name: Create and boot iOS Simulator
      run: |
        # Get the latest iOS runtime available
        RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+")
        echo "Using runtime: $RUNTIME"

        # Create simulator
        SIMULATOR_ID=$(xcrun simctl create test-device com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME" 2>&1 | tail -1)
        echo "Created simulator: $SIMULATOR_ID"

        # Boot it
        xcrun simctl boot "$SIMULATOR_ID"

        # Wait for it to boot
        sleep 5

        echo "SIMULATOR_ID=$SIMULATOR_ID" >> $GITHUB_ENV

    - name: Run tests with iOS Simulator
      run: |
        xcodebuild test \
          -scheme MediaBridge \
          -destination "id=${{ env.SIMULATOR_ID }}" \
          -derivedDataPath .build \
          -enableCodeCoverage YES \
          -verbose

  build-oldest-supported-xcode:
    name: Build (Xcode 16.4)
    runs-on: macos-15
    env:
      OLDEST_SUPPORTED_XCODE: /Applications/Xcode_16.4.app

    steps:
    - uses: actions/checkout@v5

    - name: Select oldest supported Xcode
      run: sudo xcode-select -s "$OLDEST_SUPPORTED_XCODE/Contents/Developer"

    - name: Show Swift version
      run: swift --version

    - name: Build for iOS
      run: |
        xcodebuild build \
          -scheme MediaBridge \
          -destination 'generic/platform=iOS'
